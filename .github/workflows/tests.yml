name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: myEnvironments

    env:
      EMAIL_YAEL: ${{ secrets.EMAIL_YAEL }}
      PASSWORD_YAEL: ${{ secrets.PASSWORD_YAEL }}
      EMAIL_NAAMA: ${{ secrets.EMAIL_NAAMA }}
      PASSWORD_NAAMA: ${{ secrets.PASSWORD_NAAMA }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest

      - name: Upload test results (screenshots, videos, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
