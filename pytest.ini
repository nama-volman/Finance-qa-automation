[pytest]
testpaths = tests
pythonpath = .
addopts =
    --output=test-results
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    -sv
    # --strict-markers
markers =
    smoke: basic checks that a page loads and its main elements are displayed
    navigation: checks that links/buttons lead to the right page or open the right dialog
    login: positive and negative tests for login, forgot password and sign out
    dashboard: data checks on the Dashboard page (balances, wallets, transactions)
    wallets: data checks on the Wallets page (conversion calculator)
    addCard: positive and negative tests for adding a payment card
    deleteCard: tests for deleting a payment card
    addCardDup: known bug - the same card can be added twice
    addBankAccount: positive and negative tests for adding a bank account
    deleteBankAccount: tests for deleting a bank account
    profile: tests for changing display name and preferred currency
    historyFilters: tests for the date, currency, type and Clear filters on the Transaction History page