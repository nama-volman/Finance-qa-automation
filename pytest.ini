[pytest]
testpaths = tests
pythonpath = .
addopts =
    --output=test-results
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --junitxml=reports/results.xml
    -sv
    --strict-markers
# Every test has 2 markers: first positive/negative, then one area marker.
markers =
    positive: valid input / happy path - the feature works as it should
    negative: invalid input, a blocked action, or a rule the app must enforce
    smoke: basic checks that a page loads and its main elements are displayed
    navigation: checks that links/buttons lead to the right page or open the right dialog
    login: login, forgot password and sign out
    dashboard: data checks on the Dashboard page (balances, wallets, transactions)
    wallets: Wallets page - conversion calculator and the max-wallets rule
    historyFilters: date, currency, type and Clear filters on the Transaction History page
    cards: adding and deleting payment cards
    bankAccounts: adding and deleting bank accounts
    profile: changing display name and preferred currency
    api: Send Money backend tests through the Supabase REST / RPC API